name: Build the desktop app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,cloud,build]"
      - run: python scripts/build_app.py --check
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Pack
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../EasyDBMS-${{ runner.os }}.zip EasyDBMS; else tar czf ../EasyDBMS-${{ runner.os }}.tar.gz EasyDBMS*; fi
      - uses: actions/upload-artifact@v4
        with:
          name: EasyDBMS-${{ runner.os }}
          path: |
            EasyDBMS-*.zip
            EasyDBMS-*.tar.gz
